{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand"><h1>🔒 Forgot Password</h1>
        <p>Enter your account email and we'll send you a reset link.</p></div>
        <form method="post">{% csrf_token %}
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" required autofocus placeholder="you@example.com">
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-loading>Send Reset Link</button>
        </form>
        <p class="center" style="margin-top:1rem"><a href="{% url 'login' %}" class="link">← Back to login</a></p>
    </div>
</div>
{% endblock %}
