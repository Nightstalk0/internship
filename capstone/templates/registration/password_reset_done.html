{% extends 'base.html' %}
{% block title %}Reset Link Sent{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card center">
        <div class="empty-ico">📧</div>
        <h1>Check your email</h1>
        <p class="muted">If an account exists with that email, a password reset link has been sent.
        (In development mode, the email is printed to the terminal/console.)</p>
        <a href="{% url 'login' %}" class="btn btn-primary btn-block">Back to Login</a>
    </div>
</div>
{% endblock %}
